let almanacData = null;

function fitAlmanacText(text, maxWidth, font) {
  ctx.save();
  ctx.font = font;
  let out = String(text || "");
  if (ctx.measureText(out).width > maxWidth) {
    while (out.length && ctx.measureText(out + "…").width > maxWidth) {
      out = out.slice(0, -1);
    }
    out += "…";
  }
  ctx.restore();
  return out;
}

function clampAlmanacLines(text, maxWidth, font, maxLines) {
  const lines = wrapTipText(text, maxWidth, font);
  if (lines.length <= maxLines) return lines;
  const out = lines.slice(0, maxLines);
  out[maxLines - 1] = fitAlmanacText(out[maxLines - 1] + "…", maxWidth, font);
  return out;
}

function almanacPageCount() {
  const table = Game.almanac.tab === "plants" ? PLANTS : ZOMBIES;
  return Math.max(1, Math.ceil(Object.keys(table).length / 4));
}

function getAlmanacData() {
  if (almanacData) return almanacData;
  const bodyFont = "12px 'Microsoft YaHei', sans-serif";
  const statFont = "11px 'Microsoft YaHei', sans-serif";
  const quoteFont = "italic 11px 'Microsoft YaHei', sans-serif";
  const makeEntry = function (def, isPlant) {
    const info = def.info, lore = def.lore;
    return {
      key: def.key,
      isPlant: isPlant,
      name: def.name,
      tag: fitAlmanacText(lore.tag, 420, "12px 'Microsoft YaHei', sans-serif"),
      role: fitAlmanacText("定位 · " + info.role, 420, "13px 'Microsoft YaHei', sans-serif"),
      skillLines: clampAlmanacLines("技能 · " + info.skill, 420, bodyFont, 2),
      stats: fitAlmanacText("数值 · " + info.stats.join(" · "), 420, statFont),
      loreTitle: fitAlmanacText("档案 · " + lore.title, 420, "12px 'Microsoft YaHei', sans-serif"),
      originLines: clampAlmanacLines(lore.origin, 420, "11px 'Microsoft YaHei', sans-serif", 2),
      quote: fitAlmanacText("“" + lore.quote + "”", 420, quoteFont),
      bodyFont: bodyFont,
      statFont: statFont,
      quoteFont: quoteFont
    };
  };
  almanacData = {
    plants: Object.keys(PLANTS).map(function (key) { return makeEntry(PLANTS[key], true); }),
    zombies: Object.keys(ZOMBIES).map(function (key) { return makeEntry(ZOMBIES[key], false); })
  };
  return almanacData;
}

function drawAlmanacCard(entry, x, y, w) {
  U.roundRect(ctx, x, y, w, 210, 12);
  ctx.fillStyle = "rgba(255,255,255,.045)";
  ctx.fill();
  ctx.strokeStyle = "rgba(143,170,112,.35)";
  ctx.lineWidth = 1;
  ctx.stroke();

  U.roundRect(ctx, x + 10, y + 12, 90, 128, 9);
  ctx.fillStyle = "rgba(8,16,9,.55)";
  ctx.fill();
  drawSprite(entry.key, x + 55, y + 76,
    entry.isPlant ? 80 : 72, entry.isPlant ? 96 : 104, { t: 0 });

  const tx = x + 112;
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.font = "bold 17px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#efffc5";
  ctx.fillText(entry.name, tx, y + 14);
  ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#a9c78d";
  ctx.fillText(entry.tag, tx, y + 37);
  ctx.font = "13px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#b9d19f";
  ctx.fillText(entry.role, tx, y + 58);
  ctx.font = entry.bodyFont;
  ctx.fillStyle = "#e8f2e2";
  for (let i = 0; i < entry.skillLines.length; i++) {
    ctx.fillText(entry.skillLines[i], tx, y + 77 + i * 15);
  }
  ctx.font = entry.statFont;
  ctx.fillStyle = "#ffe1a0";
  ctx.fillText(entry.stats, tx, y + 112);
  ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#d7ca8c";
  ctx.fillText(entry.loreTitle, tx, y + 134);
  ctx.font = "11px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#b8c9ad";
  for (let i = 0; i < entry.originLines.length; i++) {
    ctx.fillText(entry.originLines[i], tx, y + 153 + i * 14);
  }
  ctx.font = entry.quoteFont;
  ctx.fillStyle = "#91af9d";
  ctx.fillText(entry.quote, tx, y + 188);
  ctx.restore();
}

function drawAlmanacTab(r, label, active) {
  U.roundRect(ctx, r.x, r.y, r.w, r.h, 9);

}

function drawAlmanacPager(r, label, enabled) {
  ctx.save();
  ctx.globalAlpha = enabled ? 1 : 0.38;

function drawAlmanac() {
  drawOverlayMask(0.8);
  U.roundRect(ctx, 44, 24, 1192, 672, 22);
  ctx.fillStyle = "rgba(18,30,17,.98)";
  ctx.fill();
  ctx.strokeStyle = "#87a96d";
  ctx.lineWidth = 2;
  ctx.stroke();

  U.text(ctx, "保卫token · 角色图鉴", CFG.W / 2, 64, 32, "#efffc5", "center");
  U.text(ctx, "token 存在证明 · 只读档案", CFG.W / 2, 88, 13, "#a9c78d", "center");
  drawAlmanacTab(UI.almanacTabPlants, "守卫", Game.almanac.tab === "plants");
  drawAlmanacTab(UI.almanacTabZombies, "僵尸", Game.almanac.tab === "zombies");
  ctx.fillStyle = "rgba(151,181,122,.35)";
  ctx.fillRect(76, 138, 1128, 1);

  const data = getAlmanacData();
  const entries = data[Game.almanac.tab];
  const pages = almanacPageCount();
  Game.almanac.page = U.clamp(Game.almanac.page, 0, pages - 1);
  const start = Game.almanac.page * 4;
  for (let i = 0; i < 4; i++) {
    const entry = entries[start + i];
    if (!entry) continue;
    const col = i % 2, row = (i / 2) | 0;
    drawAlmanacCard(entry, 76 + col * 574, 150 + row * 222, 554);
  }
  drawAlmanacPager(UI.almanacPrev, "上一页", Game.almanac.page > 0);
  drawAlmanacPager(UI.almanacNext, "下一页", Game.almanac.page < pages - 1);
  U.text(ctx, "第 " + (Game.almanac.page + 1) + " / " + pages + " 页",
    CFG.W / 2, 651, 14, "#cfe6b0", "center");

  U.roundRect(ctx, UI.almanacClose.x, UI.almanacClose.y,
    UI.almanacClose.w, UI.almanacClose.h, 8);
  ctx.fillStyle = "#33482f";
  ctx.fill();
  ctx.strokeStyle = "#7e9a6a";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  U.text(ctx, "关闭 ×", UI.almanacClose.x + UI.almanacClose.w / 2,
    UI.almanacClose.y + UI.almanacClose.h / 2, 14, "#e4efda", "center");
}

function drawDebug() {
  if (!CFG.debug) return;
  U.text(ctx, "FPS " + Game.stats.fps + " · 植物 " + Game.plants.length +
    " · 僵尸 " + Game.zombies.length + " · 子弹 " + Game.projectiles.length +
    " · 阳光 " + Game.suns.length, 240, CFG.H - 26, 13, "#b6f0a0");
}

function render() {
  ctx.clearRect(0, 0, CFG.W, CFG.H);
  if (Game.state === "MENU") drawMenu();
  else if (Game.state === "LEVEL_SELECT") drawLevelSelect();
  else if (Game.state === "RPS") drawRPS();
  else {
    drawBattle();
    if (Game.state === "INTRO") drawIntro();
    if (Game.state === "STORY") drawStory();
    if (Game.state === "ROLL") drawRoll();
    if (Game.state === "PAUSED") drawPause();
    if (Game.state === "ALMANAC") drawAlmanac();
    if (Game.state === "LOSE") drawEnd();
    if (Game.state === "WIN") drawWin();
  }
  drawDebug();
}

/* ---------------------------------------------------------------------
   [9] 主循环与启动
   --------------------------------------------------------------------- */
let lastTs = 0;
let acc = 0;

function updateCursor() {
  const m = Game.mouse;
  let pointer = false;
  if (Game.state === "MENU") pointer = pointIn(m.x, m.y, UI.start);
  if (Game.state === "MENU") pointer = pointer || pointIn(m.x, m.y, UI.rpsEntry);
  else if (Game.state === "RPS") {
    pointer = pointIn(m.x, m.y, UI.rpsBack);
    for (let i = 0; !pointer && i < UI.rpsBtns.length; i++) {
      pointer = pointIn(m.x, m.y, UI.rpsBtns[i]);
    }
  }
  else if (Game.state === "LEVEL_SELECT") {
    pointer = pointIn(m.x, m.y, UI.levelBack) || pointIn(m.x, m.y, UI.endlessCard);
    for (let i = 0; !pointer && i <= Game.campaignUnlocked && i < CAMPAIGN.length; i++) {
      pointer = pointIn(m.x, m.y, UI.campaignCard(i));
    }
  } else if (Game.state === "STORY") {
    pointer = true;
  } else if (Game.state === "ROLL") {
    for (let i = 0; i < Game.buffState.choices.length; i++) {
      if (pointIn(m.x, m.y, UI.buffCard(i))) { pointer = true; break; }
    }
  } else if (Game.state === "WIN") {
    pointer = pointIn(m.x, m.y, UI.winMenu);
  } else if (Game.state === "INTRO") {
    pointer = pointIn(m.x, m.y, UI.introStart);
  } else if (Game.state === "PAUSED") {
    pointer = pointIn(m.x, m.y, UI.pauseResume) || pointIn(m.x, m.y, UI.pauseRestart) ||
      pointIn(m.x, m.y, UI.pauseMenu);
  } else if (Game.state === "ALMANAC") {
    pointer = pointIn(m.x, m.y, UI.almanacClose) ||
      pointIn(m.x, m.y, UI.almanacTabPlants) || pointIn(m.x, m.y, UI.almanacTabZombies) ||
      (Game.almanac.page > 0 && pointIn(m.x, m.y, UI.almanacPrev)) ||
      (Game.almanac.page < almanacPageCount() - 1 && pointIn(m.x, m.y, UI.almanacNext));
  } else if (Game.state === "LOSE") {
    pointer = pointIn(m.x, m.y, UI.endPrimary) || pointIn(m.x, m.y, UI.endMenu);
  } else if (Game.state === "PLAYING") {
    pointer = pointIn(m.x, m.y, UI.pause) || pointIn(m.x, m.y, UI.almanac) ||
      pointIn(m.x, m.y, CFG.shovel);
    if (!pointer && inGrid(m.x, m.y) && Game.selected >= 0) pointer = true;
    if (!pointer) {
      for (let i = 0; i < Game.cards.length; i++) {
        if (pointIn(m.x, m.y, cardRect(i))) { pointer = true; break; }
      }
    }
  }
  canvas.style.cursor = pointer ? "pointer" : "crosshair";
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  // 切后台回来时 dt 可能极大，钳制后丢弃多余累积，避免一口吃掉所有僵尸
  if (dt > 0.25 * CFG.speedMultiplier) dt = 0.25 * CFG.speedMultiplier;

  acc += dt * CFG.speedMultiplier;
  let steps = 0;
  while (acc >= CFG.FIXED_DT && steps < CFG.maxSteps) {
    step(CFG.FIXED_DT);
    acc -= CFG.FIXED_DT;
    steps++;
  }
  if (steps >= CFG.maxSteps) acc = 0;

  Game.stats.acc += dt;
  Game.stats.frames++;
  if (Game.stats.acc >= 0.5) {
    Game.stats.fps = Math.round(Game.stats.frames / Game.stats.acc);
    Game.stats.acc = 0;
    Game.stats.frames = 0;
  }

  updateCursor();
  render();
  requestAnimationFrame(loop);
}

function boot() {
  Game.campaignUnlocked = loadCampaignUnlocked();
  setState("MENU");
  Game.sunFallTimer = CFG.sun.fallFirst;
  requestAnimationFrame(loop);
}

loadAssets().then(boot);
